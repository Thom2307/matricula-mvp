spring.application.name=matricula-mvp
server.port=8080

# Base de datos en memoria (se recrea y se precarga en cada arranque)
spring.datasource.url=jdbc:h2:mem:matricula;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Consola H2 para inspeccionar datos: http://localhost:8080/h2-console
spring.h2.console.enabled=true

spring.jackson.default-property-inclusion=non_null
